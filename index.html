<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070d">
<meta name="description" content="FCM 26 — a free browser football management career game with the full real 2026 player database.">
<title>Football Club Manager 2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0e18'/%3E%3Cpath d='M16 5l9 3.2v7.1c0 6.1-3.8 9.9-9 11.7-5.2-1.8-9-5.6-9-11.7V8.2z' fill='%23b6ff2e'/%3E%3Cpath d='M16 8.2l6 2.2v4.9c0 4.1-2.5 6.8-6 8.2-3.5-1.4-6-4.1-6-8.2v-4.9z' fill='%230a0e18'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="brand"><span class="logo">FCM</span><span class="logo-year">26</span></div>
    <div id="topbar-mid">
      <div id="top-club"></div>
      <div id="top-next"></div>
    </div>
    <div id="topbar-right">
      <div id="top-funds"></div>
      <div id="top-date"></div>
      <button id="btn-advance" class="btn btn-primary btn-advance">▶ ADVANCE</button>
    </div>
  </header>
  <nav id="nav">
    <button class="nav-btn" data-screen="home"><span class="nav-ic">🏠</span>Home</button>
    <button class="nav-btn" data-screen="squad"><span class="nav-ic">👥</span>Squad</button>
    <button class="nav-btn" data-screen="transfers"><span class="nav-ic">💼</span>Transfers</button>
    <button class="nav-btn" data-screen="academy"><span class="nav-ic">🎓</span>Academy</button>
    <button class="nav-btn" data-screen="season"><span class="nav-ic">📅</span>Season</button>
    <button class="nav-btn" data-screen="club"><span class="nav-ic">🏛️</span>Club</button>
    <button class="nav-btn" data-screen="news"><span class="nav-ic">📰</span>News<span id="news-badge" class="badge hide"></span></button>
    <button class="nav-btn" data-screen="intl" id="nav-intl" style="display:none"><span class="nav-ic">🌍</span>International</button>
    <button class="nav-btn" data-screen="settings"><span class="nav-ic">⚙️</span>Settings</button>
  </nav>
  <main id="content"></main>
</div>
<div id="adv-overlay" class="hide">
  <div class="adv-box">
    <div class="spinner"></div>
    <div id="adv-date"></div>
    <div class="adv-hint">Simulating the football world…</div>
  </div>
</div>
<div id="modal-root"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
